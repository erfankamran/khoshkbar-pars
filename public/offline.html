<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>آفلاین | پارس</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      background: #06241a;
      color: #f7f3e8;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 340px; }
    .icon {
      width: 72px; height: 72px; margin: 0 auto 20px;
      border-radius: 24px; background: #0d3a27;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px;
    }
    h1 { font-size: 18px; font-weight: 800; margin-bottom: 10px; }
    p { font-size: 13px; line-height: 1.9; color: #c9d6cd; margin-bottom: 22px; }
    button {
      background: #d4af37; color: #06241a; border: 0; cursor: pointer;
      font: inherit; font-size: 14px; font-weight: 800;
      padding: 12px 32px; border-radius: 16px;
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌰</div>
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>فعلاً نمی‌توانیم محصولات تازه را نشان دهیم. تا برقراری دوباره اینترنت، صفحه را دوباره بارگذاری کنید — سبد خرید شما محفوظ است.</p>
    <button onclick="location.reload()">تلاش دوباره</button>
  </div>
</body>
</html>
