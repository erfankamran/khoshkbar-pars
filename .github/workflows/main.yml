name: 🏗️ Build production bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: 🎉 Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v6

      # ——— نصب وابستگی‌ها با bun (قفل bun.lock) — postinstall خودش prisma generate می‌زند ———
      - name: 🧰 Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
        env:
          DATABASE_URL: file:../db/custom.db

      # ——— بیلد production (standalone) — DEV_MODE خاموش تا کلیدهای تستی OTP در باندل نروند ———
      - name: 🏗️ Build production bundle
        run: bun run build
        env:
          DATABASE_URL: file:../db/custom.db
          AUTH_SECRET: ci-build-placeholder
          NEXT_PUBLIC_DEV_MODE: "false"
          NEXT_PUBLIC_SITE_URL: https://pars.webdana.ir

      # ——— چیدمان نهایی دقیقاً مطابق Application root در cPanel ———
      - name: 🗂️ Stage cPanel layout
        run: |
          mkdir -p deploy-stage/.next/standalone deploy-stage/prisma deploy-stage/tmp
          cp -r .next/standalone/. deploy-stage/.next/standalone/
          cp deploy/cpanel/server.js deploy-stage/server.js
          cp prisma/schema.prisma deploy-stage/prisma/schema.prisma
          echo "$(date -u '+%Y-%m-%d %H:%M:%S')" > deploy-stage/tmp/restart.txt

      # ——— بسته‌بندی ZIP — بدون FTP و بدون هیچ سکرتی ———
      - name: 📦 Zip bundle
        run: cd deploy-stage && zip -r ../pars-deploy.zip . && cd .. && ls -lh pars-deploy.zip

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pars-deploy
          path: pars-deploy.zip
          retention-days: 14
